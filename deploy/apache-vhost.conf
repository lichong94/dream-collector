<VirtualHost *:80>
    ServerAdmin webmaster@example.com
    DocumentRoot "/var/www/dream"
    ServerName dream.example.com
    ErrorLog "/var/log/apache2/dream-error_log"
    CustomLog "/var/log/apache2/dream-access_log" combined
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@example.com
    DocumentRoot "/var/www/dream"
    ServerName dream.example.com
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/dream.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dream.example.com/privkey.pem
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    ErrorLog "/var/log/apache2/dream-ssl-error_log"
    CustomLog "/var/log/apache2/dream-ssl-access_log" combined

    # 禁止访问敏感文件
    <Files ~ (\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md|install.sql)$>
        Order allow,deny
        Deny from all
    </Files>

    # PHP 7.4 通过 Unix Socket 解析
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/tmp/php-cgi-74.sock|fcgi://localhost"
    </FilesMatch>

    <Directory "/var/www/dream">
        SetOutputFilter DEFLATE
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm
    </Directory>
</VirtualHost>
